<style>
  :root {
    --bg:#000; --fg:#fff; --dim:#8a8a8a; --tile:#121212; --accent:#ffb000; --btn:#1e1e1e; --btnfg:#fff;
  }
  body.day { --bg:#fff; --fg:#000; --dim:#555; --tile:#ededed; --accent:#c25e00; --btn:#dadada; --btnfg:#000; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system, system-ui, "SF Pro Display", sans-serif; overflow:hidden;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; overscroll-behavior:none; }
  #app { height:100%; display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px)
             calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 12px); }
  .num { font-variant-numeric: tabular-nums; }

  /* top bar */
  .top { display:flex; align-items:center; gap:10px; padding:6px 0; }
  .gps { flex:1; display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:var(--dim); white-space:nowrap; overflow:hidden; }
  .dot { width:12px; height:12px; border-radius:50%; background:#777; flex:none; }
  .rec { color:var(--accent); display:none; }
  .running .rec { display:inline; }
  .clock { flex:1; text-align:center; font-size:22px; font-weight:800; }
  .theme { flex:1; display:flex; justify-content:flex-end; }
  .theme button, .topBtns button { background:var(--btn); color:var(--btnfg); border:0; border-radius:10px; padding:8px 14px; font:700 15px inherit; font-family:inherit; }

  /* body layout */
  .main { flex:1; display:flex; flex-direction:column; min-height:0; }
  .speedBlock { display:flex; align-items:center; justify-content:center; gap:8px; padding:4px 0; }
  .speedCol { flex:1; display:flex; flex-direction:column; align-items:center; }
  .speed { font-weight:900; letter-spacing:-0.04em; line-height:1; font-size:min(48vw, 27vh); }
  .unit { font-size:20px; font-weight:800; letter-spacing:4px; color:var(--dim); margin-top:2px; }
  .gearBox { border:3px solid var(--tile); border-radius:16px; padding:8px 14px; text-align:center; color:var(--dim); }
  .gearBox .lbl { font-size:13px; font-weight:800; letter-spacing:2px; }
  .gearBox .g { font-size:min(18vw, 9vh); font-weight:900; line-height:1.1; }
  .gearBox .note { font-size:10px; font-weight:600; }

  .side { display:flex; flex-direction:column; flex:1; min-height:0; }
  .grid { display:grid; grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:8px; margin-top:8px; flex:1; max-height:46vh; }
  .tile { background:var(--tile); border-radius:14px; padding:10px 14px; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .tile .lbl { font-size:12px; font-weight:800; letter-spacing:1.5px; color:var(--dim); }
  .tile .val { font-size:min(10vw, 44px); font-weight:800; white-space:nowrap; overflow:hidden; }
  .tile .u { font-size:16px; font-weight:700; color:var(--dim); }

  .buttons { display:flex; gap:8px; margin-top:auto; padding-top:8px; }
  .big { flex:1; height:64px; border:0; border-radius:16px; font-family:inherit; font-size:20px; font-weight:900; letter-spacing:1px;
         background:var(--btn); color:var(--btnfg); }
  .big:active { opacity:.6; }
  .big.go { background:var(--accent); color:#000; }

  /* landscape: speed left, tiles right */
  @media (orientation: landscape) {
    .main { flex-direction:row; gap:12px; }
    .speedBlock { flex:1.15; }
    .speed { font-size:min(42vh, 26vw); }
    .gearBox .g { font-size:min(18vh, 9vw); }
    .grid { grid-template-columns:1fr 1fr 1fr; max-height:none; }
    .tile .val { font-size:min(9vh, 40px); }
  }

  /* map view */
  .mapWrap { display:none; flex:1; position:relative; border-radius:14px; overflow:hidden; margin-top:6px; min-height:0; }
  body.mapMode .main { display:none; }
  body.mapMode .mapWrap { display:block; }
  #map { position:absolute; inset:0; background:#1a1a1a; }
  #map.darkTiles .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .ov { position:absolute; z-index:500; background:rgba(0,0,0,.78); color:#fff; border-radius:14px; }
  .mapSpeed { left:10px; top:10px; padding:6px 16px 8px; text-align:center; }
  .mapSpeed .num { font-size:60px; font-weight:900; line-height:1; }
  .mapSpeed .mu { font-size:12px; font-weight:800; letter-spacing:3px; color:#bbb; }
  .mapStats { left:10px; bottom:24px; padding:8px 14px; font-size:20px; font-weight:800; }
  .mapStats .u { color:#bbb; font-size:15px; }
  .mapBtn { right:10px; border:0; padding:12px 16px; font-family:inherit; font-size:16px; font-weight:800; }
  #layerBtn { top:10px; }
  #recenterBtn { bottom:24px; background:var(--accent); color:#000; }
  .mapMsg { left:50%; top:50%; transform:translate(-50%,-50%); padding:14px 18px; font-size:17px; font-weight:700; text-align:center; }
  .leaflet-control-attribution { font-size:9px !important; }
  .topBtns { display:flex; gap:8px; }

  /* overlays */
  .hint { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 96px); transform:translateX(-50%);
          background:var(--accent); color:#000; font-size:18px; font-weight:800; padding:10px 18px; border-radius:12px;
          opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .hint.show { opacity:1; }
  .overlay { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center;
             padding:32px; text-align:center; gap:18px; }
  .overlay h1 { margin:0; font-size:34px; }
  .overlay p { margin:0; color:var(--dim); font-size:18px; line-height:1.45; max-width:440px; }
  .overlay .big { flex:none; width:100%; max-width:360px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="gps"><span class="dot" id="gpsDot"></span><span id="gpsText">GPS off</span><span class="rec">● REC</span></div>
    <div class="clock num" id="clock">--:--</div>
    <div class="theme"><div class="topBtns"><button id="viewBtn">MAP</button><button id="themeBtn">DAY</button></div></div>
  </div>

  <div class="main">
    <div class="speedBlock">
      <div class="speedCol">
        <div class="speed num" id="speed">0</div>
        <div class="unit">MPH</div>
      </div>
      <div class="gearBox">
        <div class="lbl">GEAR</div>
        <div class="g" id="gear">–</div>
        <div class="note">sensor<br>not linked</div>
      </div>
    </div>

    <div class="side">
      <div class="grid">
        <div class="tile"><div class="lbl">TRIP</div><div class="val num"><span id="trip">0.0</span><span class="u"> mi</span></div></div>
        <div class="tile"><div class="lbl">MAX</div><div class="val num"><span id="max">0</span><span class="u"> mph</span></div></div>
        <div class="tile"><div class="lbl">AVG (MOVING)</div><div class="val num"><span id="avg">0</span><span class="u"> mph</span></div></div>
        <div class="tile"><div class="lbl">RIDE TIME</div><div class="val num" id="rideTime">0:00</div></div>
        <div class="tile"><div class="lbl">HEADING</div><div class="val" id="heading">--</div></div>
        <div class="tile"><div class="lbl">ALTITUDE</div><div class="val num"><span id="alt">--</span><span class="u"> ft</span></div></div>
      </div>
    </div>
  </div>

  <div class="mapWrap" id="mapWrap">
    <div id="map"></div>
    <div class="ov mapSpeed"><div class="num" id="mSpeed">0</div><div class="mu">MPH</div></div>
    <div class="ov mapStats"><span class="num" id="mTrip">0.0</span><span class="u"> mi</span> &nbsp;<span class="num" id="mTime">0:00</span></div>
    <button class="ov mapBtn" id="layerBtn">STREET</button>
    <button class="ov mapBtn hidden" id="recenterBtn">RECENTER</button>
    <div class="ov mapMsg hidden" id="mapMsg">Map needs a cell signal to load.<br>Speed and trip still work.</div>
  </div>

  <div class="buttons">
    <button class="big go" id="runBtn">START RIDE</button>
    <button class="big" id="resetBtn">RESET</button>
  </div>
</div>

<div class="hint" id="hint"></div>

<div class="overlay" id="startOverlay">
  <h1>XT250 Dash</h1>
  <p id="startMsg">Tap below to turn on GPS. Allow location when your iPhone asks.</p>
  <button class="big go" id="enableBtn">TURN ON GPS</button>
</div>

<script>
(() => {
  const MPS_TO_MPH = 2.23694, M_TO_MI = 0.000621371, M_TO_FT = 3.28084;
  const MOVING_MPH = 2.5;   // below this = stopped (kills GPS drift)
  const GOOD_ACC_M = 25;    // only trust fixes this accurate for distance/max
  const STORE_KEY = 'xt250dash.trip.v1', THEME_KEY = 'xt250dash.theme';
  const TRACK_KEY = 'xt250dash.track.v1', LAYER_KEY = 'xt250dash.layer', VIEW_KEY = 'xt250dash.view';
  const MAX_TRACK_PTS = 8000;
  const EMPTY = { distM:0, maxMph:0, movingMs:0, rideMs:0 };

  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  let trip = { ...EMPTY };
  try { const raw = store.get(STORE_KEY); if (raw) trip = { ...EMPTY, ...JSON.parse(raw) }; } catch(e) {}
  let running = false, lastGood = null, lastAny = null, smooth = 0, lastTick = Date.now();
  let live = { mph:0, acc:null, heading:null, altFt:null };
  let watchId = null, wakeLock = null, hintTimer = null;

  // ride track: list of segments, each a list of [lat, lng]
  let track = [[]];
  try { const t = JSON.parse(store.get(TRACK_KEY) || 'null'); if (Array.isArray(t) && t.length) track = t; } catch(e) {}
  const trackCount = () => track.reduce((n, seg) => n + seg.length, 0);

  const save = () => { store.set(STORE_KEY, JSON.stringify(trip)); store.set(TRACK_KEY, JSON.stringify(track)); };

  // ---------- map ----------
  const LAYERS = [
    { name:'STREET', url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png', dark:true,
      opt:{ maxZoom:19, attribution:'&copy; OpenStreetMap contributors' } },
    { name:'TOPO', url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', dark:false,
      opt:{ maxZoom:17, subdomains:'abc', attribution:'&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)' } },
    { name:'SAT', url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', dark:false,
      opt:{ maxZoom:19, attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics' } },
  ];
  let leafletFailed = false;
  let map = null, tiles = null, trackLine = null, me = null, follow = true, lastPos = null;
  let layerIdx = Math.min(parseInt(store.get(LAYER_KEY) || '0', 10) || 0, LAYERS.length - 1);
  const ME_SVG = '<svg viewBox="0 0 44 44" width="44" height="44"><g id="meRot"><path id="meArrow" d="M22 1 L30 15 L14 15 Z" fill="#1e90ff" stroke="#fff" stroke-width="2"/><circle cx="22" cy="22" r="10" fill="#1e90ff" stroke="#fff" stroke-width="3"/></g></svg>';

  function darkTiles() {
    if (map) $('map').classList.toggle('darkTiles', !document.body.classList.contains('day') && LAYERS[layerIdx].dark);
  }
  function setLayer(i) {
    layerIdx = i; store.set(LAYER_KEY, String(i));
    $('layerBtn').textContent = LAYERS[i].name;
    if (!map) return;
    if (tiles) map.removeLayer(tiles);
    tiles = L.tileLayer(LAYERS[i].url, LAYERS[i].opt).addTo(map);
    if (map.getZoom() > LAYERS[i].opt.maxZoom) map.setZoom(LAYERS[i].opt.maxZoom);
    darkTiles();
  }
  function ensureMap() {
    if (map) { map.invalidateSize(); updateMap(); return; }
    if (!window.L) { if (leafletFailed) $('mapMsg').classList.remove('hidden'); return; } // else still loading
    $('mapMsg').classList.add('hidden');
    map = L.map('map', { zoomControl:false, attributionControl:true })
      .setView(lastPos || [39.8, -98.6], lastPos ? 16 : 4);
    setLayer(layerIdx);
    trackLine = L.polyline(track, { color:'#ffb000', weight:5, opacity:.95 }).addTo(map);
    me = L.marker([0, 0], { icon: L.divIcon({ className:'', html: ME_SVG, iconSize:[44,44], iconAnchor:[22,22] }), interactive:false });
    map.on('dragstart', () => { follow = false; $('recenterBtn').classList.remove('hidden'); });
    updateMap();
  }
  function updateMap() {
    if (!map || !document.body.classList.contains('mapMode') || !lastPos) return;
    if (!map.hasLayer(me)) { me.addTo(map); map.setView(lastPos, 16); }
    me.setLatLng(lastPos);
    const g = document.getElementById('meRot'), arrow = document.getElementById('meArrow');
    if (g && arrow) {
      const h = live.heading;
      arrow.style.display = h == null ? 'none' : '';
      g.setAttribute('transform', h == null ? '' : `rotate(${h} 22 22)`);
    }
    if (follow) map.panTo(lastPos, { animate:true, duration:0.5 });
  }
  function setView(mapMode) {
    document.body.classList.toggle('mapMode', mapMode);
    $('viewBtn').textContent = mapMode ? 'DASH' : 'MAP';
    store.set(VIEW_KEY, mapMode ? 'map' : 'dash');
    if (mapMode) setTimeout(ensureMap, 30);
  }

  function haversine(a, b) {
    const R = 6371000, r = d => d * Math.PI / 180;
    const dLat = r(b.latitude - a.latitude), dLon = r(b.longitude - a.longitude);
    const s = Math.sin(dLat/2)**2 + Math.cos(r(a.latitude))*Math.cos(r(b.latitude))*Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(s));
  }
  function bearing(a, b) {
    const r = d => d * Math.PI / 180, y = Math.sin(r(b.longitude - a.longitude)) * Math.cos(r(b.latitude));
    const x = Math.cos(r(a.latitude))*Math.sin(r(b.latitude)) - Math.sin(r(a.latitude))*Math.cos(r(b.latitude))*Math.cos(r(b.longitude - a.longitude));
    return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
  }
  const pad = n => String(n).padStart(2, '0');
  function fmtDur(ms) {
    const t = Math.floor(ms/1000), h = Math.floor(t/3600), m = Math.floor((t%3600)/60), s = t%60;
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
  }
  function fmtClock(d) {
    let h = d.getHours(); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
    return `${h}:${pad(d.getMinutes())} ${ap}`;
  }
  function cardinal(deg) {
    if (deg == null || isNaN(deg) || deg < 0) return '--';
    return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45) % 8];
  }
  function showHint(t) {
    const h = $('hint'); h.textContent = t; h.classList.add('show');
    clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), 2000);
  }

  function render() {
    $('speed').textContent = Math.round(live.mph);
    const mi = trip.distM * M_TO_MI;
    $('trip').textContent = mi.toFixed(1);
    $('max').textContent = Math.round(trip.maxMph);
    $('avg').textContent = trip.movingMs > 0 ? Math.round(mi / (trip.movingMs / 3600000)) : 0;
    $('rideTime').textContent = fmtDur(trip.rideMs);
    $('mSpeed').textContent = Math.round(live.mph);
    $('mTrip').textContent = mi.toFixed(1);
    $('mTime').textContent = fmtDur(trip.rideMs);
    $('heading').textContent = cardinal(live.heading);
    $('alt').textContent = live.altFt != null ? Math.round(live.altFt).toLocaleString() : '--';
    const acc = live.acc;
    let color = '#777', text = watchId == null ? 'GPS off' : 'GPS searching';
    if (acc != null) {
      if (acc <= 10) { color = '#2ecc40'; text = `±${Math.round(acc)} m`; }
      else if (acc <= GOOD_ACC_M) { color = '#ffb000'; text = `±${Math.round(acc)} m`; }
      else { color = '#ff4136'; text = `weak ±${Math.round(acc)} m`; }
    }
    $('gpsDot').style.background = color; $('gpsText').textContent = text;
  }

  function onFix(pos) {
    const c = pos.coords, t = pos.timestamp || Date.now();
    let raw = 0;
    if (c.speed != null && !isNaN(c.speed) && c.speed >= 0) raw = c.speed * MPS_TO_MPH;
    else if (lastAny) { const dt = (t - lastAny.t) / 1000; if (dt >= 0.8) raw = haversine(lastAny.c, c) / dt * MPS_TO_MPH; }
    lastAny = { c, t };

    smooth = smooth * 0.4 + raw * 0.6;
    const mph = smooth < MOVING_MPH ? 0 : smooth;
    const good = c.accuracy != null && c.accuracy <= GOOD_ACC_M;

    const prevGood = lastGood;
    if (good) {
      if (running && lastGood && mph > 0) {
        const dtMs = Math.min(t - lastGood.t, 5000);
        if (dtMs > 0) {
          trip.distM += haversine(lastGood.c, c);
          trip.movingMs += dtMs;
          trip.maxMph = Math.max(trip.maxMph, mph);
        }
      }
      lastGood = { c, t };
      if (running && mph > 0) {
        const seg = track[track.length - 1];
        const last = seg[seg.length - 1];
        const pt = [Math.round(c.latitude * 1e5) / 1e5, Math.round(c.longitude * 1e5) / 1e5];
        if (!last || haversine({ latitude:last[0], longitude:last[1] }, c) > 8) {
          seg.push(pt);
          if (trackCount() > MAX_TRACK_PTS) { track[0].shift(); if (!track[0].length && track.length > 1) track.shift(); }
          if (trackLine) trackLine.setLatLngs(track);
        }
      }
    }
    let hdg = (c.heading != null && !isNaN(c.heading) && c.heading >= 0) ? c.heading : null;
    if (hdg == null && mph > 0 && prevGood && haversine(prevGood.c, c) > 5) hdg = bearing(prevGood.c, c);
    live = { mph, acc: c.accuracy, heading: mph > 0 ? hdg : null,
             altFt: c.altitude != null ? c.altitude * M_TO_FT : null };
    lastPos = [c.latitude, c.longitude];
    render();
    updateMap();
  }

  function onGeoError(err) {
    if (err.code === 1) { // permission denied
      if (watchId != null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      $('startMsg').innerHTML = 'Location is blocked. Go to <b>Settings → Privacy &amp; Security → Location Services</b>, make sure it\'s on and that <b>Safari Websites</b> is set to <b>While Using</b>. Then tap below.';
      $('startOverlay').classList.remove('hidden');
    }
    // timeouts / unavailable: keep watching, the dot shows "searching"
  }

  function startGps() {
    if (!('geolocation' in navigator)) { $('startMsg').textContent = 'This browser has no GPS access.'; return; }
    if (watchId != null) navigator.geolocation.clearWatch(watchId);
    watchId = navigator.geolocation.watchPosition(onFix, onGeoError,
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
    $('startOverlay').classList.add('hidden');
    requestWake();
    render();
  }

  async function requestWake() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!('wakeLock' in navigator)) {
        showHint('Set Auto-Lock to Never while riding');
      }
    } catch (e) { /* ignore */ }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (watchId != null) requestWake(); lastTick = Date.now(); }
    else save();
  });
  window.addEventListener('pagehide', save);

  // 1-second tick
  let ticks = 0;
  setInterval(() => {
    const n = Date.now();
    $('clock').textContent = fmtClock(new Date(n));
    if (running) {
      trip.rideMs += Math.min(n - lastTick, 5000);
      if (++ticks % 5 === 0) save();
      render();
    }
    lastTick = n;
  }, 1000);

  // buttons
  $('enableBtn').addEventListener('click', startGps);
  $('runBtn').addEventListener('click', () => {
    running = !running; lastTick = Date.now(); lastGood = null;
    if (running && track[track.length - 1].length) track.push([]);
    document.body.classList.toggle('running', running);
    $('runBtn').textContent = running ? 'PAUSE' : 'START RIDE';
    $('runBtn').classList.toggle('go', !running);
    if (!running) save();
    if (watchId == null) startGps();
    requestWake();
  });

  // reset: must HOLD for 0.8 s
  let holdTimer = null;
  const resetBtn = $('resetBtn');
  const holdStart = e => { e.preventDefault(); holdTimer = setTimeout(() => {
      holdTimer = null; trip = { ...EMPTY }; lastGood = null; track = [[]]; if (trackLine) trackLine.setLatLngs(track); save(); render(); showHint('Trip reset');
      if (navigator.vibrate) navigator.vibrate(50);
    }, 800); };
  const holdEnd = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; showHint('Hold to reset trip'); } };
  resetBtn.addEventListener('touchstart', holdStart, { passive:false });
  resetBtn.addEventListener('touchend', holdEnd);
  resetBtn.addEventListener('touchcancel', () => { clearTimeout(holdTimer); holdTimer = null; });
  resetBtn.addEventListener('mousedown', holdStart);
  resetBtn.addEventListener('mouseup', holdEnd);

  // theme
  function applyTheme(day) {
    document.body.classList.toggle('day', day);
    $('themeBtn').textContent = day ? 'NIGHT' : 'DAY';
    document.querySelector('meta[name=theme-color]').setAttribute('content', day ? '#ffffff' : '#000000');
    darkTiles();
  }
  let day = store.get(THEME_KEY) === 'day';
  applyTheme(day);
  $('themeBtn').addEventListener('click', () => { day = !day; applyTheme(day); store.set(THEME_KEY, day ? 'day' : 'night'); });

  // no pinch/double-tap zoom while riding
  document.addEventListener('gesturestart', e => e.preventDefault());

  $('viewBtn').addEventListener('click', () => setView(!document.body.classList.contains('mapMode')));
  $('layerBtn').addEventListener('click', () => setLayer((layerIdx + 1) % LAYERS.length));
  $('recenterBtn').addEventListener('click', () => {
    follow = true; $('recenterBtn').classList.add('hidden');
    if (map && lastPos) map.setView(lastPos, Math.max(map.getZoom(), 15));
  });
  window.addEventListener('resize', () => { if (map) setTimeout(() => map.invalidateSize(), 100); });
  $('layerBtn').textContent = LAYERS[layerIdx].name;
  // load the map library in the background so the dash still opens instantly with no signal
  (function loadLeaflet() {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => { if (document.body.classList.contains('mapMode')) ensureMap(); };
    js.onerror = () => { leafletFailed = true; if (document.body.classList.contains('mapMode')) $('mapMsg').classList.remove('hidden'); };
    document.head.appendChild(js);
  })();
  if (store.get(VIEW_KEY) === 'map') setView(true);

  $('clock').textContent = fmtClock(new Date());
  render();
})();
</script>
</body>
</html>
